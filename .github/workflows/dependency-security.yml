name: Dependency Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2.x
        with:
          php-version: "8.4"
          extensions: dom, curl, libxml, pdo_sqlite, mbstring, fileinfo, zip, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer Audit
        run: composer audit --locked --no-interaction

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: "22"

      - name: Run NPM Audit Checker Self-Tests
        run: node --test scripts/security/check-npm-audit.test.mjs

      - name: NPM Production Audit
        run: node scripts/security/check-npm-audit.mjs

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.x
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      - name: Run pip-audit
        run: pip-audit -r ocr-service/requirements.txt

  container-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x

      - name: Build OCR Image
        run: docker build --pull -t siperbang-ocr:security-scan ./ocr-service

      - name: Run Trivy Vulnerability Scanner (HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'siperbang-ocr:security-scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
          trivy-version: 'v0.74.0'

      - name: Run Trivy Vulnerability Scanner (CRITICAL Blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'siperbang-ocr:security-scan'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL'
          trivyignores: '.trivyignore'
          trivy-version: 'v0.74.0'
          skip-setup-trivy: true
